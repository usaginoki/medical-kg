[project]
name = "research-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.130.0",
    "duckdb>=1.5.6",
    "kagglehub>=1.0.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "torch",
    "torchvision",
    "xlrd>=2.0.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
